<style>

    --bg-card: #FFFFFF;

    --rose: #EFC4B7;
    --rose-deep: #D89A8A;
    --rose-text: #8C4F40;
    --cream: #F5EADC;
    --cream-deep: #E8D5BE;
    --sage: #D8DFC8;
    --sage-text: #6A7654;
    --text: #3D2E26;
    --text-soft: #8A776B;
    --text-mute: #BCAA9D;
    --border: #F0E4DA;

  .day-tab.work.active { background: var(--rose-text); border-style: solid; border-color: var(--rose-text); color: white; }
  .info-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 6px 12px; border-radius: 100px; font-weight: 500; letter-spacing: 0.3px; display: inline-flex; align-items: center; gap: 5px; }
  .badge-work { background: var(--rose); color: var(--rose-text); }
  .badge-home { background: var(--sage); color: var(--sage-text); }
  .badge-shop { background: var(--cream-deep); color: #8A6A3D; }
  .badge-cheat { background: #E8D5E8; color: #6D4B6D; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 10px 14px; background: var(--bg-card); border-radius: 14px; margin-bottom: 16px; font-size: 11px; box-shadow: var(--shadow); }
  .legend-item { display: flex; align-items: center; gap: 6px; color: var(--text-soft); }

  .legend-dot.heart { background: var(--rose); }

  .meal-header-left { display: flex; align-items: center; gap: 14px; flex: 1; }
  .meal-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }

  .icon-pranz { background: var(--sage); }

  .meal-chevron { color: var(--text-mute); transition: transform 0.3s ease; font-size: 12px; }

  .meal-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }

  .ingredient-list { padding: 0 18px 16px; }
  .ingredient { display: flex; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); gap: 12px; }
  .ingredient:last-child { border-bottom: none; }
  .ingredient-check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--text-mute); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s ease; background: white; }

  .ingredient-check.checked { background: var(--rose-deep); border-color: var(--rose-deep); }

  .ingredient-portion { font-size: 11px; color: var(--text-soft); font-weight: 500; background: var(--bg); padding: 4px 9px; border-radius: 100px; white-space: nowrap; margin-left: 4px; }
  .highlight-fiber { background: linear-gradient(transparent 62%, var(--sage) 62%); padding: 0 2px; }
  .highlight-heart { background: linear-gradient(transparent 62%, var(--rose-soft) 62%); padding: 0 2px; }

  .tip-card { background: linear-gradient(135deg, var(--rose-soft) 0%, var(--cream) 100%); border-radius: 22px; padding: 20px; margin: 22px 0 12px; position: relative; overflow: hidden; }

  .tip-eyebrow { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--rose-text); font-weight: 600; margin-bottom: 8px; position: relative; }
  .tip-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; margin-bottom: 8px; line-height: 1.25; position: relative; }
  .tip-body { font-size: 13px; line-height: 1.55; opacity: 0.85; position: relative; }
  .bottom-actions { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .action-btn { background: var(--bg-card); border: 1px solid var(--border); padding: 13px 14px; border-radius: 16px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 6px; }

  .action-btn-primary { background: var(--rose-deep); color: white; border-color: var(--rose-deep); box-shadow: 0 4px 14px rgba(216, 154, 138, 0.3); }
  .divider-ornament { text-align: center; color: var(--text-mute); margin: 28px 0 8px; font-family: 'Fraunces', serif; font-style: italic; font-size: 13px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(60, 45, 38, 0.45); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; z-index: 100; animation: fadeOverlay 0.25s ease; }
  .modal-overlay.open { display: flex; }
  @keyframes fadeOverlay { from { opacity: 0; } to { opacity: 1; } }
  .modal { background: var(--bg); width: 100%; max-width: 480px; border-radius: 28px 28px 0 0; padding: 24px 20px max(env(safe-area-inset-bottom), 24px); max-height: 85vh; overflow-y: auto; animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }

  .modal-handle { width: 40px; height: 4px; background: var(--text-mute); border-radius: 100px; margin: 0 auto 16px; opacity: 0.4; }
  .modal-title { font-family: 'Fraunces', serif; font-size: 22px; margin-bottom: 4px; }
  .modal-subtitle { font-size: 12px; color: var(--text-soft); margin-bottom: 20px; }
  .shop-section { background: var(--bg-card); border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }

  .shop-item:last-child { border-bottom: none; }

  .shop-check { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--text-mute); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: white; }
  .shop-check.checked { background: var(--rose-deep); border-color: var(--rose-deep); }
  .shop-check.checked::after { content: '✓'; color: white; font-size: 11px; font-weight: 700; }
  .shop-name { flex: 1; }
  .modal-close { width: 100%; padding: 14px; background: var(--text); color: var(--bg); border: none; border-radius: 16px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; margin-top: 10px; cursor: pointer; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(150%); background: var(--text); color: var(--bg); padding: 12px 22px; border-radius: 100px; font-size: 13px; z-index: 200; transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: 0 8px 24px rgba(60,45,38,0.25); }

</style>
</head>

    { section: 'Legume + fructe', items: ['Spanac proaspăt', 'Roșii cherry', 'Castraveți', 'Ardei gras', 'Ceapă roșie', 'Dovlecel', 'Avocado (2 buc)', 'Banane', 'Mere verzi', 'Afine', 'Zmeură', 'Lămâi'] },

    { section: 'Cămară + sec', items: ['Ovăz integral', 'Quinoa', 'Paste FG integrale', 'Năut D\'Aucy', 'Linte uscată', 'Tortilla FG', 'Pâine integrală secară', 'Semințe in', 'Semințe chia', 'Migdale crude', 'Unt de migdale', 'Măsline kalamata'] }
  ],
  vineri: [
    { section: 'Pentru caserole (joi-vineri-sâmbătă)', items: ['Piept de pui (600g)', 'Curcan (400g)', 'Orez brun', 'Quinoa', 'Broccoli', 'Morcovi', 'Sparanghel', 'Cartof dulce', 'Năut sau linte (conservă)'] },
    { section: 'Pește + tofu', items: ['Somon (180g)', 'Cod sau dorada (200g)', 'Tofu natural (200g)'] },
    { section: 'Legume + fructe weekend', items: ['Sfeclă roșie', 'Rucola', 'Salată verde mixtă', 'Pere', 'Banane', 'Pomelo sau grapefruit', 'Roșii cherry'] },
    { section: 'Diverse', items: ['Hummus', 'Țelină tulpini', 'Lapte migdale Alpro', 'Lapte orez Vemondo', 'Ciocolată 85% Lindt', 'Nuci'] }
  ]
};
const iconMap = {
  mic: { class: 'icon-mic', emoji: '☕' },
  pranz: { class: 'icon-pranz', emoji: '🌿' },
  cina: { class: 'icon-cina', emoji: '🌙' },
  gustare: { class: 'icon-gustare', emoji: '✿' }
};
const dayOrder = ['luni', 'marti', 'miercuri', 'joi', 'vineri', 'sambata', 'duminica'];
const dayMap = { 0: 'duminica', 1: 'luni', 2: 'marti', 3: 'miercuri', 4: 'joi', 5: 'vineri', 6: 'sambata' };
let currentDay = dayMap[new Date().getDay()];
let checkedState = {};
let shopState = {};
const today = new Date();
document.getElementById('todayDate').textContent = today.toLocaleDateString('ro-RO', { weekday: 'long', day: 'numeric', month: 'long' });
function renderTabs() {
  const container = document.getElementById('dayTabs');
  container.innerHTML = '';
  dayOrder.forEach(key => {
    const day = planData[key];
    const btn = document.createElement('button');
    btn.className = 'day-tab';
    if (day.type === 'work') btn.classList.add('work');
    if (key === currentDay) btn.classList.add('active');
    btn.textContent = day.label;
    btn.onclick = () => { currentDay = key; renderTabs(); renderMeals(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    container.appendChild(btn);
  });
}
function highlightFood(food, tag) {
  if (tag === 'fiber') return `<span class="highlight-fiber">${food}</span>`;
  if (tag === 'heart') return `<span class="highlight-heart">${food}</span>`;
  if (tag === 'both') return `<span class="highlight-both">${food}</span>`;
  return food;
}
function renderMeals() {
  const day = planData[currentDay];
  const container = document.getElementById('mealContainer');
  container.innerHTML = '';
  document.getElementById('progressTitle').textContent = currentDay === dayMap[new Date().getDay()] ? 'Astăzi' : day.label;
  const infoRow = document.createElement('div');
  infoRow.className = 'info-row';
  let badgeClass = 'badge-home', badgeText = '🏠 ' + day.note;
  if (day.type === 'work') { badgeClass = 'badge-work'; badgeText = '💼 ' + day.note; }
  if (day.type === 'cheat') { badgeClass = 'badge-cheat'; badgeText = '✨ ' + day.note; }
  if (day.type === 'shop') { badgeClass = 'badge-shop'; badgeText = '🛒 ' + day.note; }
  const mainBadge = document.createElement('div');
  mainBadge.className = 'badge ' + badgeClass;
  mainBadge.textContent = badgeText;
  infoRow.appendChild(mainBadge);
  container.appendChild(infoRow);
  const celebContainer = document.getElementById('celebrationContainer');
  celebContainer.innerHTML = '';
  let allTotal = 0, allDone = 0;
  day.meals.forEach((meal, idx) => {
    meal.items.forEach((item, itemIdx) => {
      allTotal++;
      if (checkedState[`${currentDay}-${idx}-${itemIdx}`]) allDone++;
    });
  });
  if (allTotal > 0 && allDone === allTotal) {
    const celeb = document.createElement('div');
    celeb.className = 'celebration';
    celeb.innerHTML = '✿ Felicitări! Ai bifat toată ziua. Ești o forță. ✿';
    celebContainer.appendChild(celeb);
  }
  day.meals.forEach((meal, idx) => {
    const section = document.createElement('div');
    section.className = 'meal-section';
    let mealTotal = meal.items.length, mealDone = 0;
    meal.items.forEach((item, itemIdx) => {
      if (checkedState[`${currentDay}-${idx}-${itemIdx}`]) mealDone++;
    });
    if (mealDone === mealTotal) section.classList.add('done');
    if (idx === 0 && mealDone < mealTotal) section.classList.add('open');
    const icon = iconMap[meal.type];
    const header = document.createElement('div');
    header.className = 'meal-header';
    const countClass = mealDone === mealTotal ? 'meal-count complete' : 'meal-count';
    header.innerHTML = `
      <div class="meal-header-left">
        <div class="meal-icon ${icon.class}">${icon.emoji}</div>
        <div>
          <div class="meal-title">${meal.name}</div>
          ${meal.subtitle ? `<div class="meal-subtitle">${meal.subtitle}</div>` : ''}
        </div>
      </div>
      <div style="display:flex;align-items:center;">
        <span class="${countClass}">${mealDone}/${mealTotal}</span>
        <span class="meal-chevron">▾</span>
      </div>`;
    header.onclick = () => section.classList.toggle('open');
    const content = document.createElement('div');
    content.className = 'meal-content';
    const list = document.createElement('div');
    list.className = 'ingredient-list';
    meal.items.forEach((item, itemIdx) => {
      const key = `${currentDay}-${idx}-${itemIdx}`;
      const isChecked = checkedState[key];
      const ing = document.createElement('div');
      ing.className = 'ingredient' + (isChecked ? ' done' : '');
      ing.innerHTML = `
        <div class="ingredient-check ${isChecked ? 'checked' : ''}"></div>
        <div class="ingredient-name">${highlightFood(item.food, item.tag)}</div>
        <div class="ingredient-portion">${item.portion}</div>`;
      ing.querySelector('.ingredient-check').onclick = (e) => {
        e.stopPropagation();
        checkedState[key] = !checkedState[key];
        saveState();
        renderMeals();
      };
      list.appendChild(ing);
    });
    content.appendChild(list);
    section.appendChild(header);
    section.appendChild(content);
    container.appendChild(section);
  });
  document.getElementById('tipTitle').textContent = day.tip.title;
  document.getElementById('tipBody').textContent = day.tip.body;
  document.getElementById('progressFill').style.width = (allTotal > 0 ? (allDone/allTotal)*100 : 0) + '%';
  document.getElementById('progressText').textContent = `${allDone} / ${allTotal} bifate`;
}
function resetDay() {
  if (!confirm('Resetezi bifele de azi?')) return;
  Object.keys(checkedState).forEach(key => {
    if (key.startsWith(currentDay + '-')) delete checkedState[key];
  });
  saveState();
  renderMeals();
  showToast('Bifele au fost resetate ✿');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2200);
}
function openShopping() {
  renderShopping();
  document.getElementById('shopModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeShopping(e) {
  if (e && e.target && e.target.id !== 'shopModal' && e.type === 'click') return;
  document.getElementById('shopModal').classList.remove('open');
  document.body.style.overflow = '';
}
function renderShopping() {
  const container = document.getElementById('shopContent');
  container.innerHTML = '';
  ['miercuri', 'vineri'].forEach(day => {
    const dayLabel = day === 'miercuri' ? 'Miercuri' : 'Vineri';
    shoppingLists[day].forEach((sec, sIdx) => {
      const block = document.createElement('div');
      block.className = 'shop-section';
      const dayClass = day === 'vineri' ? 'shop-day vineri' : 'shop-day';
      block.innerHTML = `<div class="shop-section-title"><span class="${dayClass}">${dayLabel}</span> ${sec.section}</div>`;
      sec.items.forEach((item, iIdx) => {
        const key = `${day}-${sIdx}-${iIdx}`;
        const checked = shopState[key];
        const row = document.createElement('div');
        row.className = 'shop-item' + (checked ? ' checked' : '');
        row.innerHTML = `<div class="shop-check ${checked ? 'checked' : ''}"></div><div class="shop-name">${item}</div>`;
        row.querySelector('.shop-check').onclick = () => {
          shopState[key] = !shopState[key];
          saveShopState();
          renderShopping();
        };
        block.appendChild(row);
      });
      container.appendChild(block);
    });
  });
}
function saveState() { try { localStorage.setItem('plan_checkedState', JSON.stringify(checkedState)); } catch(e) {} }
function saveShopState() { try { localStorage.setItem('plan_shopState', JSON.stringify(shopState)); } catch(e) {} }
function loadState() {
  try {
    const s = localStorage.getItem('plan_checkedState');
    if (s) checkedState = JSON.parse(s);
    const sh = localStorage.getItem('plan_shopState');
    if (sh) shopState = JSON.parse(sh);
  } catch(e) {}
}
loadState();
renderTabs();
renderMeals();
</script>
